name: Build static election atlas
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: general-elections-hex-${{ github.sha }}
          path: dist
